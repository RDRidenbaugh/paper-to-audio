# Builds the standalone apps on real Windows and macOS machines (PyInstaller can't
# cross-compile) and commits them to downloads/ so the README links stay current.
name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "paper2audio/**"
      - "paper_to_audio.py"
      - "requirements.txt"
      - "build_app.py"
      - ".github/workflows/build-apps.yml"

concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: Paper-to-Audio-Windows.exe
          - os: macos-latest            # Apple Silicon
            file: Paper-to-Audio-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_app.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv "dist/Paper to Audio.exe" "${{ matrix.file }}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the bundle's symlinks and code signature intact.
        run: ditto -c -k --keepParent "dist/Paper to Audio.app" "${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Commit builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add downloads
          git diff --cached --quiet && exit 0
          git commit -m "Build standalone apps for ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
